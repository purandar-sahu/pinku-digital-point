<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Pinku Digital Point</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f8fc;color:#18263b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;width:100%;max-width:400px;padding:26px 22px;border-radius:14px;box-shadow:0 6px 24px #0001}
h1{font-size:22px;color:#102b50;margin-bottom:4px}
p.sub{font-size:13px;color:#738198;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid #d5dde8;border-radius:8px;font-size:15px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#1769d2;color:#fff;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
#msg{margin-top:14px;font-size:14px;text-align:center}
.err{color:#c62828}.ok{color:#16a36a}
.links{text-align:center;margin-top:16px;font-size:13px;line-height:2}
.links a{color:#1769d2}
#forgot{background:none;border:0;color:#1769d2;font-size:13px;width:auto;margin:10px auto 0;display:block;padding:4px;font-weight:normal;text-decoration:underline}
</style>
</head>
<body>
<div class="box">
<h1>Customer Login</h1>
<p class="sub">Login to view your service requests.</p>
<label for="email">Email</label>
<input id="email" type="email" autocomplete="email">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password">
<button id="btn">Login</button>
<button id="forgot" type="button">Forgot password?</button>
<div id="msg"></div>
<div class="links">
New customer? <a href="register.html">Create account</a><br>
<a href="index.html">← Back to Home</a>
</div>
</div>

<script type="module">
import { auth } from "./firebase-init.js";
import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const msg = document.getElementById("msg");
const btn = document.getElementById("btn");
function show(text, ok){ msg.textContent = text; msg.className = ok ? "ok" : "err"; }

btn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) return show("Please enter email and password.");
  btn.disabled = true;
  show("Logging in...", true);
  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "dashboard.html";
  } catch (e) {
    let t = "Something went wrong. Please try again.";
    if (e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/user-not-found") t = "Wrong email or password.";
    else if (e.code === "auth/invalid-email") t = "Please enter a valid email.";
    else if (e.code === "auth/too-many-requests") t = "Too many attempts. Please try again later.";
    show(t);
    btn.disabled = false;
  }
});

document.getElementById("forgot").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) return show("Enter your email first, then tap Forgot password.");
  try {
    await sendPasswordResetEmail(auth, email);
    show("Password reset email sent. Please check your inbox.", true);
  } catch (e) {
    show("Could not send reset email. Check the email address.");
  }
});
</script>
</body>
</html>
